<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#101014" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pocket Rogue" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="icon" href="./icon-192.png" />
    <title>Pocket Rogue</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="controls">
        <!-- 中身は main.ts が ViewModel から組み立てる -->
        <div id="slots"></div>
        <div id="pad">
          <button type="button" data-dir="-1,-1" aria-label="左上">↖</button>
          <button type="button" data-dir="0,-1" aria-label="上">↑</button>
          <button type="button" data-dir="1,-1" aria-label="右上">↗</button>
          <button type="button" data-dir="-1,0" aria-label="左">←</button>
          <button type="button" data-dir="0,0" aria-label="待機" class="wait">待つ</button>
          <button type="button" data-dir="1,0" aria-label="右">→</button>
          <button type="button" data-dir="-1,1" aria-label="左下">↙</button>
          <button type="button" data-dir="0,1" aria-label="下">↓</button>
          <button type="button" data-dir="1,1" aria-label="右下">↘</button>
        </div>
      </div>
      <button type="button" id="menu-btn" aria-label="メニュー">≡</button>
    </div>

    <dialog id="menu">
      <h2>Pocket Rogue</h2>
      <p id="menu-equip" class="hint"></p>
      <p class="hint">同じ seed なら同じダンジョンになります。友人と seed を交換して遊べます。</p>
      <label for="seed-input">seed</label>
      <div class="row">
        <input id="seed-input" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="16" />
        <button type="button" id="seed-random">ランダム</button>
        <button type="button" id="seed-copy">コピー</button>
      </div>
      <div class="row actions">
        <button type="button" id="new-game" class="primary">この seed で新しいゲーム</button>
        <button type="button" id="menu-scores">ハイスコア</button>
        <button type="button" id="menu-close">閉じる</button>
      </div>
      <p class="hint small">PC はカーソルキー・テンキー・hjklyubn で移動、. または Space で待機。</p>
    </dialog>

    <dialog id="gameover">
      <h2 id="go-title">ゲームオーバー</h2>
      <p id="go-rank" class="rank"></p>
      <div class="stats">
        <div class="score"><span id="go-score">0</span><small>点</small></div>
        <ul id="go-detail"></ul>
      </div>
      <div class="row actions">
        <button type="button" id="go-new" class="primary">新しい seed で始める</button>
        <button type="button" id="go-retry">同じ seed でもう一度</button>
        <button type="button" id="go-seed">seed を選んで始める</button>
        <button type="button" id="go-scores">ハイスコア</button>
        <button type="button" id="go-close">閉じる</button>
      </div>
    </dialog>

    <dialog id="confirm">
      <p id="confirm-text"></p>
      <div class="row actions">
        <button type="button" id="confirm-yes" class="primary"></button>
        <button type="button" id="confirm-no"></button>
      </div>
    </dialog>

    <dialog id="scores">
      <h2>ハイスコア</h2>
      <ol id="score-list"></ol>
      <p class="hint small">seed をタップすると、その seed で新しいゲームを始めます。</p>
      <div class="row actions">
        <button type="button" id="scores-close">閉じる</button>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
